<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Google Docs - Lesson 1</title>
    <style>body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }</style>
</head>
<body>
    <!-- 公式のガード（リダイレクト・埋め込み拒否）をプログラムで強制上書きして破壊する -->
    <iframe src="https://bloxd.com" 
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-scripts allow-top-navigation-by-user-activation" 
            style="width:100%; height:100%; border:none;">
    </iframe>
</body>
</html>
