<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Google Drive - Homework Docs</title>
    <style>
        body, html { margin:0; padding:0; width:100%; height:100%; background:#1a1a1a; font-family:sans-serif; color:#fff; overflow:hidden; }
        .container { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; }
        h1 { margin-bottom:20px; font-size:24px; color:#4caf50; }
        input { width:60%; padding:15px; font-size:18px; border:2px solid #4caf50; border-radius:30px; background:#2a2a2a; color:#fff; outline:none; text-align:center; }
        iframe { width:100%; height:100%; border:none; display:none; }
    </style>
</head>
<body>
    <div class="container" id="setup">
        <h1>Educational Document Search</h1>
        <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://bloxd.com) and press Enter">
    </div>
    <iframe id="proxyFrame" src=""></iframe>

    <script>
        const input = document.getElementById('urlInput');
        const setup = document.getElementById('setup');
        const frame = document.getElementById('proxyFrame');

        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                let targetUrl = input.value;
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    targetUrl = 'https://' + targetUrl;
                }
                frame.src = 'https://w3schools.com' + encodeURIComponent(targetUrl);
                setup.style.display = 'none';
                frame.style.display = 'block';
            }
        });
    </script>
</body>
</html>
